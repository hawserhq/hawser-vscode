name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, bundle, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --production
      # Packaging in CI catches manifest mistakes (missing publisher, bad
      # activation events) before a release does.
      - run: npx @vscode/vsce package --no-dependencies -o hawser.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: hawser-vsix
          path: hawser.vsix
          retention-days: 14
