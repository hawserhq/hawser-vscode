# Keeps the toolchain current without a flood of PRs: npm devDependencies are
# grouped so one weekly PR bumps TypeScript/esbuild/vsce/types together, and
# GitHub Actions get their own weekly check. The extension has no runtime
# dependencies (single esbuild bundle), so every npm bump is build-time only.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node must match the VS Code extension host's Node major (20 for
      # engines.vscode ^1.90); a newer major would type APIs that do not exist
      # at runtime. Bump it deliberately when raising engines.vscode.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors change compiler behaviour (7.x dropped automatic
      # @types inclusion); take them on purpose, not by bot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
